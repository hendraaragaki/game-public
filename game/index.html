<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gondola Langit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3a67; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* On-screen touch controls: hidden on desktop, shown on touch devices or narrow screens. */
  #touch { display: none; position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  @media (pointer: coarse), (max-width: 800px) {
    #touch { display: block; }
  }
  #touch button {
    pointer-events: auto;
    border-radius: 50%;
    background: rgba(20, 16, 40, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.5);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    padding: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #touch button:active, #touch button.held { background: rgba(255, 255, 255, 0.35); }
  .dpad {
    position: absolute; left: 14px; bottom: 14px;
    display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px);
    gap: 4px;
  }
  .dpad [data-dir="up"] { grid-column: 2; grid-row: 1; }
  .dpad [data-dir="left"] { grid-column: 1; grid-row: 2; }
  .dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }
  .dpad [data-dir="down"] { grid-column: 2; grid-row: 3; }
  #sprayBtn { position: absolute; right: 18px; bottom: 34px; width: 84px; height: 84px; font-size: 34px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gondola Langit: clean the windows of the Sky Tower before the festival begins"></canvas>
<div id="touch">
  <div class="dpad" role="group" aria-label="Move">
    <button type="button" data-dir="up" aria-label="Move up" tabindex="-1">▲</button>
    <button type="button" data-dir="left" aria-label="Move left" tabindex="-1">◀</button>
    <button type="button" data-dir="right" aria-label="Move right" tabindex="-1">▶</button>
    <button type="button" data-dir="down" aria-label="Move down" tabindex="-1">▼</button>
  </div>
  <button type="button" id="sprayBtn" data-spray aria-label="Spray" tabindex="-1">💦</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
